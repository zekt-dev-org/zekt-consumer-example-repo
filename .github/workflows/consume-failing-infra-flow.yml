name: Intentional Failing Infra Flow

on:
  repository_dispatch:
    types: [service-new-failure-request]

permissions:
  id-token: write   # Required by zekt-action for OIDC auth
  contents: read    # Needed by actions/checkout


jobs:
  handle-zekt-event:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo output object from previous orchestration method
        id: fail
        shell: pwsh
        run: |

          # Values from Service_A are already substituted by Zekt backend
          $failure_value = "fail-myfakekeyfailure"
          
          # Write-Host "Received from Service_A:"
          Write-Host ("failure_value: " + $failure_value)
          
          # Pass to subsequent steps
          "failure_value=$failure_value" >> $env:GITHUB_OUTPUT

      - name: Process Zekt workflow completion
        shell: pwsh
        run: |
          Write-Host "Processing service-new-failure-request ..." -ForegroundColor Green
          # Add your custom processing logic here
          Write-Host "Workflow completed successfully!" -ForegroundColor Green

      - name: Report outputs to Zekt from service-new-failure
        uses: zekt-dev-org/zekt-action@main
        with:
          # No orchestrate: true — this is the provider reporting its output.
          # zekt-action auto-detects _zekt.orchestration from the event file and
          # forwards it as orchestration_step_ref so the backend can advance the chain.
          payload: |
            {
              "failure_value":        "${{ steps.fail.outputs.failure_value }}"
            }

      - name: Intentional Failure Step
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Error "This step is intentionally failing to simulate a failure scenario."
          throw "Intentional error / exit workflow"
          exit 1  # Exit with a non-zero status to indicate failure

          