name: New Fake OCI Autonomous DB

on:
  repository_dispatch:
    types: [new-oci-autonomous-db]

jobs:
  handle-zekt-event:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required — allows zekt-action to obtain an OIDC token
      contents: read


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display event information
        shell: pwsh
        run: |
          $event = '${{ toJson(github.event) }}' | ConvertFrom-Json
          Write-Host "Full Event Object:" -ForegroundColor Cyan
          Write-Host ($event) -ForegroundColor Cyan


          # - SHOW THE PAYLOAD - VALIDATE PROPERTY VALUES:
          # Write-Host ("base_input: " + $event.client_payload.zekt.payload.base_input) -ForegroundColor Yellow

      - name: fake-generated-oci-autonomous-db-properties
        id: work
        shell: pwsh
        run: |
          
          # Generate fake GUIDs for OCI Autonomous DB properties
          # --------------------------------------
          $oci-autonomous-db-Guid = [guid]::NewGuid().ToString()
          $oci-autonomous-db-name = ("fake-oci-autonomous-db-" + $oci-autonomous-db-Guid)

          Write-Host ("Generated OCI Autonomous DB GUID: " + $oci-autonomous-db-Guid) -ForegroundColor Yellow
          Write-Host ("Generated OCI Autonomous DB Name: " + $oci-autonomous-db-name) -ForegroundColor Yellow

          "oci-autonomous-db-guid=$oci-autonomous-db-Guid" >> $env:GITHUB_OUTPUT
          "oci-autonomous-db-name=$oci-autonomous-db-name" >> $env:GITHUB_OUTPUT

      - name: Process Zekt workflow completion
        shell: pwsh
        run: |
          Write-Host "Processing new-oci-autonomous-db ..." -ForegroundColor Green
          # Add your custom processing logic here
          Write-Host "Workflow completed successfully!" -ForegroundColor Green

      - name: Report outputs to Zekt from new-oci-autonomous-db
        uses: zekt-dev-org/zekt-action@v3
        with:
          # No orchestrate: true — this is the provider reporting its output.
          # zekt-action auto-detects _zekt.orchestration from the event file and
          # forwards it as orchestration_step_ref so the backend can advance the chain.
          payload: |
            {
              "oci-autonomous-db-guid": "${{ steps.work.outputs.oci-autonomous-db-guid }}",
              "oci-autonomous-db-name": "${{ steps.work.outputs.oci-autonomous-db-name }}"
            }