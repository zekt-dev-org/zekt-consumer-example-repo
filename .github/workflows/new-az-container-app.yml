name: New Fake Azure Container App

on:
  repository_dispatch:
    types: [new-az-container-app]

jobs:
  handle-zekt-event:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required — allows zekt-action to obtain an OIDC token
      contents: read


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display event information
        shell: pwsh
        run: |
          $event = '${{ toJson(github.event) }}' | ConvertFrom-Json
          Write-Host "Full Event Object:" -ForegroundColor Cyan
          Write-Host ($event) -ForegroundColor Cyan


          # - SHOW THE PAYLOAD - VALIDATE PROPERTY VALUES:
          # Write-Host ("base_input: " + $event.client_payload.zekt.payload.base_input) -ForegroundColor Yellow

      - name: fake-generated-az-container-app-properties
        id: work
        shell: pwsh
        run: |
          
          # Generate fake GUIDs for azure container app properties
          # --------------------------------------
          $az_container_app_Guid = [guid]::NewGuid().ToString()
          $az_container_app_name = ("fake-az-container-app-" + $az_container_app_Guid)

          Write-Host ("Generated Azure Container App GUID: " + $az_container_app_Guid) -ForegroundColor Yellow
          Write-Host ("Generated Azure Container App Name: " + $az_container_app_name) -ForegroundColor Yellow

          "az-container-app-guid=$az_container_app_Guid" >> $env:GITHUB_OUTPUT
          "az-container-app-name=$az_container_app_name" >> $env:GITHUB_OUTPUT

      - name: Process Zekt workflow completion
        shell: pwsh
        run: |
          Write-Host "Processing new-az-container-app ..." -ForegroundColor Green
          # Add your custom processing logic here
          Write-Host "Workflow completed successfully!" -ForegroundColor Green

      - name: Report outputs to Zekt from new-az-container-app
        uses: zekt-dev-org/zekt-action@main
        with:
          # No orchestrate: true — this is the provider reporting its output.
          # zekt-action auto-detects _zekt.orchestration from the event file and
          # forwards it as orchestration_step_ref so the backend can advance the chain.
          payload: |
            {
              "az-container-app-guid": "${{ steps.work.outputs.az-container-app-guid }}",
              "az-container-app-name": "${{ steps.work.outputs.az-container-app-name }}"
            }