name: Service New Subscription Request

on:
  repository_dispatch:
    types: [service-new-subscription]

jobs:
  handle-zekt-event:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required — allows zekt-action to obtain an OIDC token
      contents: read


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display event information
        shell: pwsh
        run: |
          $event = '${{ toJson(github.event) }}' | ConvertFrom-Json
          Write-Host "Full Event Object:" -ForegroundColor Cyan
          Write-Host ($event) -ForegroundColor Cyan


          # - SHOW THE PAYLOAD - VALIDATE PROPERTY VALUES:
          # Write-Host ("base_input: " + $event.client_payload.zekt.payload.base_input) -ForegroundColor Yellow

      - name: fake-generated-tenant-and-sub-guids
        id: work
        shell: pwsh
        run: |
          
          # Generate fake GUIDs for tenant and sub
          # --------------------------------------
          $tenantGuid = [guid]::NewGuid().ToString()
          $subGuid = [guid]::NewGuid().ToString()

          Write-Host ("Generated Tenant GUID: " + $tenantGuid) -ForegroundColor Yellow
          Write-Host ("Generated Sub GUID: " + $subGuid) -ForegroundColor Yellow

          "subscription_id=$subGuid" >> $env:GITHUB_OUTPUT
          "tenant_id=$tenantGuid"   >> $env:GITHUB_OUTPUT

      - name: Process Zekt workflow completion
        shell: pwsh
        run: |
          Write-Host "Processing service-new-subscription-request ..." -ForegroundColor Green
          # Add your custom processing logic here
          Write-Host "Workflow completed successfully!" -ForegroundColor Green

      - name: Report outputs to Zekt from service-new-subscription
        uses: zekt-dev-org/zekt-action@v3
        with:
          # No orchestrate: true — this is the provider reporting its output.
          # zekt-action auto-detects _zekt.orchestration from the event file and
          # forwards it as orchestration_step_ref so the backend can advance the chain.
          payload: |
            {
              "subscription_id": "${{ steps.work.outputs.subscription_id }}",
              "tenant_id":        "${{ steps.work.outputs.tenant_id }}"
            }