name: New Azure Storage Blob

on:
  repository_dispatch:
    types: [new-az-blob]

jobs:
  handle-zekt-event:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required — allows zekt-action to obtain an OIDC token
      contents: read


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display event information
        shell: pwsh
        run: |
          $event = '${{ toJson(github.event) }}' | ConvertFrom-Json
          Write-Host "Full Event Object:" -ForegroundColor Cyan
          Write-Host ($event) -ForegroundColor Cyan


          # - SHOW THE PAYLOAD - VALIDATE PROPERTY VALUES:
          # Write-Host ("base_input: " + $event.client_payload.zekt.payload.base_input) -ForegroundColor Yellow

      - name: fake-generated-az-storageblob
        id: work
        shell: pwsh
        run: |
          
          # Generate fake GUIDs for Azure Storage Blob properties
          # --------------------------------------
          $az_storageblob_Guid = [guid]::NewGuid().ToString()
          $az_storageblob_name = ("fake-storageblob-" + $az_storageblob_Guid)

          Write-Host ("Generated Azure Storage Blob GUID: " + $az_storageblob_Guid) -ForegroundColor Yellow
          Write-Host ("Generated Azure Storage Blob Name: " + $az_storageblob_name) -ForegroundColor Yellow

          "az-storageblob-guid=$az_storageblob_Guid" >> $env:GITHUB_OUTPUT
          "az-storageblob-name=$az_storageblob_name" >> $env:GITHUB_OUTPUT

      - name: Process Zekt workflow completion
        shell: pwsh
        run: |
          Write-Host "Processing new-az-blob ..." -ForegroundColor Green
          # Add your custom processing logic here
          Write-Host "Workflow completed successfully!" -ForegroundColor Green

      - name: Report outputs to Zekt from new-az-blob
        uses: zekt-dev-org/zekt-action@main
        with:
          # No orchestrate: true — this is the provider reporting its output.
          # zekt-action auto-detects _zekt.orchestration from the event file and
          # forwards it as orchestration_step_ref so the backend can advance the chain.
          payload: |
            {
              "storageblob-id": "${{ steps.work.outputs.az-storageblob-guid }}",
              "storageblob-name": "${{ steps.work.outputs.az-storageblob-name }}"
            }
