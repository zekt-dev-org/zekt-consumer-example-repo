
name: Zekt Workflow Shield Consumer

on:
  repository_dispatch:
    types: [zekt-infra-deployment-request-event]

jobs:
  handle-zekt-event:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display event information
        shell: pwsh
        run: |
          $event = '${{ toJson(github.event) }}' | ConvertFrom-Json
          Write-Host "Full Event Object:" -ForegroundColor Cyan
          Write-Host ($event | ConvertTo-Json -Depth 10)

      - name: Decrypt shielded payload
        id: decrypt-shielded-payload
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.SHIELD_PRIV_KEY }}
        run: |
          $event    = '${{ toJson(github.event) }}' | ConvertFrom-Json
          $envelope = $event.client_payload.zekt.payload

          Write-Host "=== DEBUG: Event Structure ===" -ForegroundColor Cyan
          Write-Host "envelope.type       : $($envelope.type)"
          Write-Host "envelope.iv length  : $($envelope.iv.Length)"
          Write-Host "envelope.ciphertext : $($envelope.ciphertext.Substring(0, [Math]::Min(60, $envelope.ciphertext.Length)))..."
          Write-Host "recipients count    : $(@($envelope.recipients.PSObject.Properties).Count)"

          if ($envelope.type -ne 'zekt-shield-envelope') {
            Write-Host "ERROR: Unexpected envelope type: $($envelope.type)" -ForegroundColor Red
            exit 1
          }

          # Single dispatch = exactly one recipient entry; no consumer ID secret needed
          $recipientEntry = $envelope.recipients.PSObject.Properties | Select-Object -First 1
          $consumerId     = $recipientEntry.Name
          $wrappedKey     = $recipientEntry.Value
          Write-Host "Decrypting for consumer: $consumerId" -ForegroundColor Cyan

          $privFile = [IO.Path]::GetTempFileName()
          $wrapFile = [IO.Path]::GetTempFileName()
          $keyFile  = [IO.Path]::GetTempFileName()

          try {
            $env:PRIVATE_KEY | Set-Content -Path $privFile -NoNewline -Encoding ASCII
            [IO.File]::WriteAllBytes($wrapFile, [Convert]::FromBase64String($wrappedKey))

            # Step 1: RSA-OAEP-SHA256 → raw 32-byte AES key
            $opensslOut = openssl pkeyutl -decrypt -inkey $privFile `
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 `
              -in $wrapFile -out $keyFile 2>&1

            if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: RSA unwrap failed: $opensslOut" -ForegroundColor Red
              exit 1
            }

            $aesKey = [IO.File]::ReadAllBytes($keyFile)
            Write-Host "AES key length: $($aesKey.Length) bytes" -ForegroundColor Yellow

            # Step 2: AES-256-GCM decrypt
            $ciphertext = [Convert]::FromBase64String($envelope.ciphertext)
            $plainBytes = New-Object byte[] $ciphertext.Length
            $aesGcm     = [System.Security.Cryptography.AesGcm]::new($aesKey, 16)

            $aesGcm.Decrypt(
              [Convert]::FromBase64String($envelope.iv),
              $ciphertext,
              [Convert]::FromBase64String($envelope.authTag),
              $plainBytes
            )
            $aesGcm.Dispose()

            $decryptedPayload = [System.Text.Encoding]::UTF8.GetString($plainBytes)

            Write-Host "`n=== Decryption Successful ===" -ForegroundColor Green
            Write-Host ($decryptedPayload | ConvertFrom-Json | ConvertTo-Json -Depth 10)

          } finally {
            Remove-Item $privFile, $wrapFile, $keyFile -Force -ErrorAction SilentlyContinue
          }

          # Export for subsequent steps
          "DECRYPTED_PAYLOAD<<EOF" >> $env:GITHUB_OUTPUT
          $decryptedPayload >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Use decrypted payload
        shell: pwsh
        run: |
          $payload = '${{ steps.decrypt-shielded-payload.outputs.DECRYPTED_PAYLOAD }}' | ConvertFrom-Json
          Write-Host "Environment: $($payload.environment)"

      - name: Process Zekt workflow completion
        shell: pwsh
        run: |
          Write-Host "Processing zekt-infra-deployment-request-event ..." -ForegroundColor Green
          # Add your custom processing logic here
          Write-Host "Workflow completed successfully!" -ForegroundColor Green







