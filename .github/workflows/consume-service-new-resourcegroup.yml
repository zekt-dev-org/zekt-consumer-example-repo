name: Service New Resource Group Request

on:
  repository_dispatch:
    types: [service-new-resourcegroup-request]

jobs:
  handle-zekt-event:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display event information
        shell: pwsh
        run: |
          $event = '${{ toJson(github.event) }}' | ConvertFrom-Json
          Write-Host "Full Event Object:" -ForegroundColor Cyan
          Write-Host ($event | ConvertTo-Json -Depth 10)

          # - SHOW THE PAYLOAD - VALIDATE PROPERTY VALUES:
          Write-Host ("base_input: " + $event.client_payload.zekt.payload.base_input) -ForegroundColor Yellow

      - name: Echo output object from previous orchestration method
        id: extract-input-from-orchestration
        shell: pwsh
        run: |

          # Values from Service_A are already substituted by Zekt backend
          $resourcegroup_name = "rg-myfakeresourcegroupname"
          # $tenantId = '${{ github.event.client_payload.input.tenant_id }}'
          
          # Write-Host "Received from Service_A:"
          Write-Host "Resourcegroup_name: " + $resourcegroup_name
          # Write-Host "  tenant_id: $tenantId"
          
          # Pass to subsequent steps
          resourcegroup_name=$resourcegroup_name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # "tenant_id=$tenantId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append


      - name: Process Zekt workflow completion
        shell: pwsh
        run: |
          Write-Host "Processing service-new-resourcegroup-request ..." -ForegroundColor Green
          # Add your custom processing logic here
          Write-Host "Workflow completed successfully!" -ForegroundColor Green

      - name: Report outputs to Zekt from service-new-resourcegroup
        uses: zekt-dev-org/zekt-action@v3
        with:
          # No orchestrate: true — this is the provider reporting its output.
          # zekt-action auto-detects _zekt.orchestration from the event file and
          # forwards it as orchestration_step_ref so the backend can advance the chain.
          payload: |
            {
              "resourcegroup_name":        "${{ steps.extract-input-from-orchestration.outputs.resourcegroup_name }}"
            }